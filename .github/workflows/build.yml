name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Read only by default. The publish job asks for the OIDC token it needs itself.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # runtimes for the net8.0 and net9.0 targets of IntegrationTests
          dotnet-version: |
            8.0.x
            9.0.x

      # Keyed on everything that decides the package graph. restore-keys lets a changed graph start
      # from the previous cache rather than empty.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/*.fsproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The restored cache can hold a ProjectFiles package of the same version built from another
      # commit. NuGet would use it instead of the one packed by this build, so remove it.
      - name: Remove cached ProjectFiles package
        shell: bash
        run: rm -rf ~/.nuget/packages/projectfiles

      # The tag is the version: tag 1.2.3 (or v1.2.3) builds 1.2.3. Other builds use the
      # Version in Directory.Build.props.
      - name: Resolve the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION_ARGUMENT=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build src --configuration Release ${{ env.VERSION_ARGUMENT }}

      - name: Build integration tests
        run: dotnet build IntegrationTests --configuration Release

      # NugetTests consumes the locally packed nuget, so it builds after src has been packed.
      - name: Build NugetTests
        run: dotnet build src/NugetTests/NugetTests.csproj --configuration Release ${{ env.VERSION_ARGUMENT }}

      # A project level build, without $(SolutionDir).
      - name: Build ConsumingTests
        run: dotnet build src/ConsumingTests/ConsumingTests.csproj --configuration Release --force

      - name: Test
        shell: bash
        run: |
          dotnet test src --configuration Release --no-build --no-restore
          dotnet test IntegrationTests --configuration Release --no-build --no-restore
          dotnet test src/NugetTests/NugetTests.csproj --configuration Release --no-build --no-restore
          dotnet test src/ConsumingTests/ConsumingTests.csproj --configuration Release --no-build --no-restore

      # Visual Studio builds with the .NET Framework MSBuild, which can run the compiler on .NET
      # Framework. The packed analyzer has to load there too, so build the nuget consumer that way.
      # Runs after the tests since it rebuilds the IntegrationTests output.
      - name: Add MSBuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Build with .NET Framework MSBuild
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          msbuild -version
          $project = 'IntegrationTests/IntegrationTests/IntegrationTests.csproj'
          "Default compiler type: $(msbuild $project -nologo -p:TargetFramework=net10.0 -getProperty:RoslynCompilerType)"
          # default choice of compiler
          msbuild $project -restore -t:Rebuild -p:Configuration=Release -nologo -v:m -warnaserror:CS9057,CS8032,CS8034
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # forced onto the .NET Framework hosted compiler
          msbuild $project -restore -t:Rebuild -p:Configuration=Release -p:BuildWithNetFrameworkHostedCompiler=true -nologo -v:m -warnaserror:CS9057,CS8032,CS8034
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload received on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received-${{ matrix.os }}
          path: '**/*.received.*'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload packages
        if: success() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: nugets/**/*.nupkg
          if-no-files-found: warn
          retention-days: 30

  # Trusted publishing: no stored API key. nuget.org validates GitHub's OIDC token against the
  # policy naming this repository and this workflow file, and returns a key good for an hour.
  publish:
    needs: build
    environment: nuget
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: SimonCropp

      - name: Push to nuget.org
        run: >
          dotnet nuget push "packages/**/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
